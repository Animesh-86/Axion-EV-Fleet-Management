spring.application.name=Axion

# ── Infrastructure ──────────────────────────────────
# Kafka
axion.kafka.bootstrap-servers=localhost:9092
axion.kafka.consumer.group-id=digital-twin-updater
axion.kafka.consumer.auto-offset-reset=earliest
axion.kafka.producer.retries=5
axion.kafka.producer.max-in-flight=5
axion.kafka.producer.request-timeout-ms=30000
axion.kafka.producer.delivery-timeout-ms=120000

# MQTT
axion.mqtt.broker-url=tcp://localhost:1883
axion.mqtt.client-id=axion-ingestion-service
axion.mqtt.topics=axion/telemetry/+,axion/heartbeat/+
axion.mqtt.qos=1
axion.mqtt.completion-timeout-ms=5000

# Redis
axion.redis.ttl-seconds=120

# CORS
axion.cors.allowed-origins=http://localhost,http://localhost:3000

# ── Kafka Topics ────────────────────────────────────
axion.kafka.topic.telemetry=telemetry.normal
axion.kafka.topic.ota-events=ota.events

# ── Health Scoring ──────────────────────────────────
axion.health.base-score=100
axion.health.soc-critical=15.0
axion.health.soc-warning=30.0
axion.health.battery-temp-warning=45.0
axion.health.battery-temp-critical=55.0
axion.health.packet-loss-warning=5.0
axion.health.packet-loss-critical=10.0
axion.health.penalty-warning=30
axion.health.penalty-critical=60

# ── Primary Database (PostgreSQL - Business Data) ──
spring.datasource.url=${AXION_POSTGRES_URL:jdbc:postgresql://localhost:5432/axion}
spring.datasource.username=${AXION_POSTGRES_USER:axion}
spring.datasource.password=${AXION_POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Secondary Database (TimescaleDB - Telemetry) ──
axion.tsdb.datasource.url=${AXION_TSDB_URL:jdbc:postgresql://localhost:5433/axion_ts}
axion.tsdb.datasource.username=${AXION_TSDB_USER:axion}
axion.tsdb.datasource.password=${AXION_TSDB_PASSWORD:password}
axion.tsdb.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway Migrations ──
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration/primary

axion.tsdb.flyway.enabled=true
axion.tsdb.flyway.url=${axion.tsdb.datasource.url}
axion.tsdb.flyway.user=${axion.tsdb.datasource.username}
axion.tsdb.flyway.password=${axion.tsdb.datasource.password}
axion.tsdb.flyway.locations=classpath:db/migration/tsdb

# ── Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── ML Predictive Analytics Service ──
axion.ml.service.url=${AXION_ML_URL:http://localhost:8000}

# ── Spring AI & GenAI Fleet Intelligence ──
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-fake-demo-key-for-axion-platform-testing}
# Optional file path to load OpenAI API key from (useful for Docker secrets)
# If the file exists it will be loaded at startup and during reloads
axion.openai.key-file=${AXION_OPENAI_KEY_FILE:/run/secrets/OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# ── Observability & Actuator ──
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# ── SpringDoc OpenAPI ──
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

