# ── Local Hybrid Dev Overrides ──
# Activated by: --spring.profiles.active=dev
# These override values in application.properties for local development.

# Database passwords (matching docker-compose.dev.yml)
spring.datasource.password=change_me
axion.tsdb.datasource.password=change_me
spring.flyway.password=change_me

# CORS — allow Vite dev server
axion.cors.allowed-origins=http://localhost:3000,http://localhost

# Kafka (enabled, pointing to Docker)
axion.kafka.bootstrap-servers=localhost:9092
axion.kafka.enabled=true

# JWT secret for local dev
axion.jwt.secret=YXhpb25fZGV2X2p3dF9zZWNyZXRfa2V5XzI1Nl9iaXRz

# Bootstrap admin
axion.bootstrap.admin.username=demo_admin
axion.bootstrap.admin.password=change_me
