# Disable Flyway during unit tests to avoid external DB connections
spring.flyway.enabled=false
# Prevent DataSource auto-configuration during unit tests to avoid requiring external DB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# Disable creating the primary datasource configuration during unit tests
axion.datasource.enabled=false
axion.tsdb.datasource.enabled=false
axion.kafka.enabled=false
axion.mqtt.enabled=false
axion.redis.enabled=false
axion.cors.allowed-origins=*
## Health thresholds used by HealthRules
axion.health.soc-critical=30.0
axion.health.soc-warning=40.0
axion.health.battery-temp-warning=40.0
axion.health.battery-temp-critical=45.0
axion.health.packet-loss-warning=0.05
axion.health.packet-loss-critical=0.2
axion.health.penalty-warning=5
axion.health.penalty-critical=10
axion.health.base-score=100

# Redis defaults for tests
axion.redis.ttl-seconds=3600

# Skip requiring secrets during unit tests
axion.require-secrets=false
