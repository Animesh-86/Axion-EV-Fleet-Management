persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

listener 1883
# Production: set allow_anonymous false + password_file for broker-level auth.
# For local dev/demo the backend enforces vehicle registry whitelist checks,
# but anonymous access at the broker level should be disabled when credentials
# are provisioned.  Set to true only for zero-config local startup.
allow_anonymous true
# TODO: Uncomment below and provision credentials for hardened deployments:
# allow_anonymous false
# password_file /mosquitto/config/passwd
