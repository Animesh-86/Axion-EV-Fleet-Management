# ═══════════════════════════════════════════════════════
# Axion EV Fleet Management — DEV Infrastructure Only
# Run:  docker compose -f docker-compose.dev.yml up -d
# Then run backend, frontend, ML, simulator locally.
# ═══════════════════════════════════════════════════════

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: axion-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo ruok | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: axion-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: axion-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: axion-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./Axion-Backend/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    command: /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: axion-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: axion
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: axion-timescaledb
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: axion_ts
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-change_me}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - tsdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion_ts"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
  tsdata_dev:
