# ═══════════════════════════════════════════════════════
# Axion EV Fleet Management — Full Stack Deployment
# Run:  docker compose up --build -d
# Open: http://localhost (Dashboard)
# ═══════════════════════════════════════════════════════

services:
  # ── Infrastructure ──────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: axion-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo ruok | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: axion-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.0-alpine
    container_name: axion-redis
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: axion-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./Axion-Backend/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    command: /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: axion-postgres
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_DB: axion
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: axion-timescaledb
    ports: 
      - "5433:5432"
    environment:
      POSTGRES_DB: axion_ts
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-change_me}
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion_ts"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Backend (Spring Boot) ───────────────────────────

  backend:
    build:
      context: ./Axion-Backend/ingestion
      dockerfile: Dockerfile
    container_name: axion-backend
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      # Override localhost references for container networking
      AXION_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      AXION_MQTT_BROKER_URL: "tcp://mosquitto:1883"
      AXION_CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80"
      # Temporary demo key to allow backend startup during smoke-tests.
      # Replace with a real secret or mount via Docker secret for production.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-axion-demo}
      AXION_OPENAI_KEY_FILE: ${AXION_OPENAI_KEY_FILE:-/run/secrets/OPENAI_API_KEY}
      SPRING_DATA_REDIS_HOST: "redis"
      AXION_POSTGRES_URL: "jdbc:postgresql://postgres:5432/axion"
      AXION_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      AXION_TSDB_URL: "jdbc:postgresql://timescaledb:5432/axion_ts"
      AXION_TSDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-change_me}
      AXION_KAFKA_ENABLED: "true"
      # Local/dev demo JWT secret (override with Docker secret in production)
      AXION_JWT_SECRET: "change_me_demo_secret"
      AXION_ML_URL: "http://ml:8000"
      AXION_AGENT_MONITOR_ENABLED: "true"
      AXION_BOOTSTRAP_ADMIN_USERNAME: "demo_admin"
      AXION_BOOTSTRAP_ADMIN_PASSWORD: ${AXION_BOOTSTRAP_ADMIN_PASSWORD:-change_me}
      AXION_API_PUBLICSUMMARY: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: wget -qO- http://localhost:8080/api/v1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Frontend (React → Nginx) ───────────────────────

  frontend:
    build:
      context: ./Axion-Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: axion-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  # ── Simulator (Python) ─────────────────────────────

  simulator:
    build:
      context: ./Axion-Simulator
      dockerfile: Dockerfile
    container_name: axion-simulator
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      AXION_MQTT_BROKER: mosquitto
      AXION_BACKEND_URL: http://backend:8080/api/v1/telemetry

  load-tester:
    build:
      context: ./scripts/load_test
      dockerfile: Dockerfile
    container_name: axion-load-tester
    profiles:
      - testing
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      BROKER_HOST: mosquitto

  # ── ML Predictive Analytics (FastAPI) ──────────────

  ml:
    build:
      context: ./Axion-ML
      dockerfile: Dockerfile
    container_name: axion-ml
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      AXION_TSDB_URL: "postgresql://axion:change_me@timescaledb:5432/axion_ts"
    ports:
      - "8000:8000"
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Observability & Monitoring ────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: axion-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: axion-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/axion_fleet_dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  pgdata:
  tsdata:
